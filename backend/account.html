      <main>
        <section class="feature-section">
          <div class="feature-header">
            <h1>Account Details</h1>
            <p>
              View your account information and current subscription plan.
            </p>
          </div>

          <div class="account-details">
            <div class="account-card">
              <h2>User Information</h2>
              <div id="user-info" class="info-grid">
                <div class="info-item">
                  <label>Email:</label>
                  <span id="user-email">-</span>
                </div>
                <div class="info-item">
                  <label>Role:</label>
                  <span id="user-role">-</span>
                </div>
                <div class="info-item">
                  <label>Organization:</label>
                  <span id="org-name">-</span>
                </div>
                <div class="info-item">
                  <label>Member Since:</label>
                  <span id="member-since">-</span>
                </div>
              </div>
            </div>

            <div class="account-card">
              <h2>Subscription Plan</h2>
              <div id="plan-info" class="info-grid">
                <div class="info-item">
                  <label>Current Plan:</label>
                  <span id="plan-name">-</span>
                </div>
                <div class="info-item">
                  <label>Status:</label>
                  <span id="plan-status">-</span>
                </div>
                <div class="info-item">
                  <label>Billing Cycle:</label>
                  <span id="billing-cycle">-</span>
                </div>
                <div class="info-item">
                  <label>Next Billing:</label>
                  <span id="next-billing">-</span>
                </div>
              </div>
            </div>

            <div class="account-card">
              <h2>Usage Statistics</h2>
              <div id="usage-info" class="info-grid">
                <div class="info-item">
                  <label>Total Properties:</label>
                  <span id="total-properties">-</span>
                </div>
                <div class="info-item">
                  <label>Total Units:</label>
                  <span id="total-units">-</span>
                </div>
                <div class="info-item">
                  <label>Active Leases:</label>
                  <span id="active-leases">-</span>
                </div>
                <div class="info-item">
                  <label>Open Requests:</label>
                  <span id="open-requests">-</span>
                </div>
              </div>
            </div>
          </div>

          <div class="account-actions">
            <button class="secondary" onclick="logout()">Logout</button>
          </div>
        </section>
      </main>
    </div>
    <script>
      const API_BASE = window.API_BASE || "";

      // Load account details on page load
      document.addEventListener('DOMContentLoaded', loadAccountDetails);

      async function loadAccountDetails() {
        const token = localStorage.getItem('access_token');
        if (!token) {
          window.location.href = 'auth.html';
          return;
        }

        try {
          // Load user info
          const userRes = await fetch(`${API_BASE}/api/auth/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (userRes.status === 401) {
            localStorage.removeItem('access_token');
            window.location.href = 'auth.html';
            return;
          }
          const userData = await userRes.json();

          document.getElementById('user-email').textContent = userData.email;
          document.getElementById('user-role').textContent = userData.role;
          document.getElementById('org-name').textContent = userData.organization_name || 'N/A';
          document.getElementById('member-since').textContent = new Date(userData.created_at).toLocaleDateString();

          // Load subscription info
          const subRes = await fetch(`${API_BASE}/api/billing/subscription`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (subRes.ok) {
            const subData = await subRes.json();
            document.getElementById('plan-name').textContent = subData.plan_name || 'Free';
            document.getElementById('plan-status').textContent = subData.status || 'Active';
            document.getElementById('billing-cycle').textContent = subData.interval || 'Monthly';
            document.getElementById('next-billing').textContent = subData.current_period_end ? new Date(subData.current_period_end * 1000).toLocaleDateString() : 'N/A';
          } else {
            document.getElementById('plan-name').textContent = 'Free';
            document.getElementById('plan-status').textContent = 'Active';
            document.getElementById('billing-cycle').textContent = 'N/A';
            document.getElementById('next-billing').textContent = 'N/A';
          }

          // Load usage stats from pulse
          const pulseRes = await fetch(`${API_BASE}/api/pulse`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (pulseRes.ok) {
            const pulseData = await pulseRes.json();
            document.getElementById('total-properties').textContent = 'N/A'; // Would need separate endpoint
            document.getElementById('total-units').textContent = 'N/A'; // Would need separate endpoint
            document.getElementById('active-leases').textContent = 'N/A'; // Would need separate endpoint
            document.getElementById('open-requests').textContent = pulseData.open_requests || 0;
          }

        } catch (error) {
          console.error('Error loading account details:', error);
        }
      }

      function logout() {
        localStorage.removeItem('access_token');
        window.location.href = 'auth.html';
      }
    </script>
    <style>
      .account-details {
        display: grid;
        gap: 2rem;
        margin: 2rem 0;
      }

      .account-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }

      .account-card h2 {
        margin: 0 0 1.5rem 0;
        color: var(--ink, #0f1c22);
        font-size: 1.5rem;
        font-weight: 600;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
      }

      .info-item {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .info-item label {
        font-weight: 500;
        color: var(--ink, #0f1c22);
        font-size: 0.9rem;
      }

      .info-item span {
        color: var(--ink, #0f1c22);
        font-size: 1rem;
      }

      .account-actions {
        margin-top: 2rem;
        text-align: center;
      }

      .account-actions .secondary {
        background: #f5f5f5;
        color: var(--ink, #0f1c22);
        border: 1px solid #ddd;
      }

      .account-actions .secondary:hover {
        background: #e5e5e5;
      }
    </style>
