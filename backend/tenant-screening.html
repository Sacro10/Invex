<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INDEX - Tenant Screening</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Spectral:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo">
          <svg class="logo-mark" viewBox="0 0 220 120" aria-hidden="true">
            <defs>
              <linearGradient id="leafGradient" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="#9fd4c7" />
                <stop offset="100%" stop-color="#4fc1c7" />
              </linearGradient>
              <linearGradient id="petalGradient" x1="0" x2="1" y1="1" y2="0">
                <stop offset="0%" stop-color="#67c6d3" />
                <stop offset="100%" stop-color="#3ba9c7" />
              </linearGradient>
            </defs>
            <rect x="104" y="10" width="10" height="70" rx="4" fill="#0f1c22" />
            <path
              d="M108 38c-12 4-22 14-24 26 10-2 20-10 24-21"
              fill="none"
              stroke="url(#leafGradient)"
              stroke-width="3"
              stroke-linecap="round"
            />
            <path
              d="M110 46c12 6 22 16 24 28-10-2-20-10-24-21"
              fill="none"
              stroke="url(#leafGradient)"
              stroke-width="3"
              stroke-linecap="round"
            />
            <ellipse cx="110" cy="8" rx="10" ry="7" fill="url(#leafGradient)" />
            <ellipse cx="88" cy="18" rx="12" ry="8" fill="url(#leafGradient)" />
            <ellipse cx="132" cy="18" rx="12" ry="8" fill="url(#leafGradient)" />
            <ellipse cx="84" cy="34" rx="10" ry="7" fill="url(#leafGradient)" />
            <ellipse cx="136" cy="34" rx="10" ry="7" fill="url(#leafGradient)" />
            <path
              d="M110 84c-6 10-3 20 0 26 3-6 8-14 7-23"
              fill="url(#petalGradient)"
            />
          </svg>
          <div class="logo-text">
            <span class="logo-name">INDEX</span>
            <span class="logo-sub">Property Management</span>
          </div>
        </div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="maintenance.html">Maintenance</a>
          <a href="accounting.html">Accounting</a>
          <a href="lease-renewal.html">Renewals</a>
          <a href="communication.html">Comms</a>
          <a href="properties.html">Properties</a>
          <a href="leases.html">Leases</a>
          <a class="nav-cta" href="index.html#cta">Get a demo</a>
        </nav>
      </header>

      <main class="feature-page">
        <a class="back-link" href="index.html">Back to overview</a>
        <section class="feature-hero">
          <p class="eyebrow">Automated tenant screening</p>
          <h1>AI risk assessment with real-time scoring.</h1>
          <p class="lead">
            Enter applicant details to generate a risk score and store the
            screening record in your local database.
          </p>
        </section>

        <form class="feature-form" data-endpoint="/api/tenant-screening">
          <div class="form-grid">
            <label class="form-field">
              Applicant name
              <input type="text" name="name" placeholder="Alex Carter" required />
            </label>
            <label class="form-field">
              Annual income
              <input type="number" name="income" data-type="number" placeholder="85000" required />
            </label>
            <label class="form-field">
              Credit score
              <input type="number" name="credit_score" data-type="int" placeholder="720" required />
            </label>
            <label class="form-field">
              Prior evictions
              <input type="number" name="evictions" data-type="int" placeholder="0" required />
            </label>
          </div>
          <button class="primary" type="submit">Run screening</button>
          <div class="result"></div>
        </form>

        <div class="feature-actions">
          <button class="secondary view-all" data-endpoint="/api/tenant-screenings" data-table="screening-table" data-columns='[{"key":"id","label":"ID"},{"key":"name","label":"Name"},{"key":"income","label":"Income"},{"key":"credit_score","label":"Credit Score"},{"key":"evictions","label":"Evictions"},{"key":"risk_score","label":"Risk Score"},{"key":"risk_level","label":"Risk Level"},{"key":"created_at","label":"Created"}]'>View All</button>
          <button class="secondary export-csv" data-endpoint="/api/export/tenant-screenings/csv">Export CSV</button>
        </div>
        <div id="screening-table" class="data-table"></div>
      </main>
    </div>
    <script src="feature-pages.js"></script>
  </body>
</html>
