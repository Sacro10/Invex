<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - INDEX</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo">
          <div class="logo-text">
            <span class="logo-name">INDEX</span>
            <span class="logo-sub">Property Management</span>
          </div>
        </div>
        <nav class="nav">
          <a href="index.html">Home</a>
        </nav>
      </header>

      <main class="feature-page">
        <section class="feature-hero">
          <p class="eyebrow">Secure checkout</p>
          <h1>Complete your subscription.</h1>
          <p class="lead">Select your plan and enter payment details.</p>
        </section>

        <form class="feature-form" id="checkout-form">
          <div class="form-grid">
            <label class="form-field">
              Plan
              <select name="plan" id="plan-select" required>
                <option value="core">Core - $2 / unit</option>
                <option value="growth">Growth - $4 / unit</option>
                <option value="premium">Premium - $5 / unit</option>
              </select>
            </label>
            <label class="form-field">
              Units
              <input type="number" name="units" id="units-input" placeholder="100" min="1" required />
            </label>
          </div>
          <button class="primary" type="submit">Start subscription</button>
        </form>
      </main>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const plan = params.get('plan');
      const select = document.getElementById('plan-select');
      if (plan && select) {
        select.value = plan;
      }

      const form = document.getElementById('checkout-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const plan = select.value;
        const units = parseInt(document.getElementById('units-input').value);
        
        try {
          const response = await fetch('/api/billing/create-checkout-session', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${localStorage.getItem('token')}`
            },
            body: JSON.stringify({ plan, units })
          });
          
          if (response.ok) {
            const data = await response.json();
            window.location.href = data.url;
          } else {
            alert('Failed to create checkout session');
          }
        } catch (error) {
          console.error('Error:', error);
          alert('An error occurred');
        }
      });
    </script>
  </body>
</html>
