<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INDEX - Lease Management</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Spectral:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo">
          <svg class="logo-mark" viewBox="0 0 220 120" aria-hidden="true">
            <defs>
              <linearGradient id="leafGradient" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="#9fd4c7" />
                <stop offset="100%" stop-color="#4fc1c7" />
              </linearGradient>
              <linearGradient id="petalGradient" x1="0" x2="1" y1="1" y2="0">
                <stop offset="0%" stop-color="#67c6d3" />
                <stop offset="100%" stop-color="#3ba9c7" />
              </linearGradient>
            </defs>
            <rect x="104" y="10" width="10" height="70" rx="4" fill="#0f1c22" />
            <path
              d="M108 38c-12 4-22 14-24 26 10-2 20-10 24-21"
              fill="none"
              stroke="url(#leafGradient)"
              stroke-width="3"
              stroke-linecap="round"
            />
            <path
              d="M110 46c12 6 22 16 24 28-10-2-20-10-24-21"
              fill="none"
              stroke="url(#leafGradient)"
              stroke-width="3"
              stroke-linecap="round"
            />
            <ellipse cx="110" cy="8" rx="10" ry="7" fill="url(#leafGradient)" />
            <ellipse cx="88" cy="18" rx="12" ry="8" fill="url(#leafGradient)" />
            <ellipse cx="132" cy="18" rx="12" ry="8" fill="url(#leafGradient)" />
            <ellipse cx="84" cy="34" rx="10" ry="7" fill="url(#leafGradient)" />
            <ellipse cx="136" cy="34" rx="10" ry="7" fill="url(#leafGradient)" />
            <path
              d="M110 84c-6 10-3 20 0 26 3-6 8-14 7-23"
              fill="url(#petalGradient)"
            />
          </svg>
          <div class="logo-text">
            <span class="logo-name">INDEX</span>
            <span class="logo-sub">Property Management</span>
          </div>
        </div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="tenant-screening.html">Screening</a>
          <a href="maintenance.html">Maintenance</a>
          <a href="accounting.html">Accounting</a>
          <a href="lease-renewal.html">Renewals</a>
          <a href="communication.html">Comms</a>
          <a href="properties.html">Properties</a>
          <a class="nav-cta" href="index.html#cta">Get a demo</a>
        </nav>
      </header>

      <main class="feature-page">
        <a class="back-link" href="index.html">Back to overview</a>
        <section class="feature-hero">
          <p class="eyebrow">Lease management</p>
          <h1>Create and manage property leases.</h1>
          <p class="lead">
            Set up new leases with tenant and property details, rent amounts, and dates.
          </p>
        </section>

        <form class="feature-form" data-endpoint="/api/leases">
          <div class="form-grid">
            <label class="form-field">
              Tenant ID
              <input type="text" name="tenant_id" placeholder="TEN-102" required />
            </label>
            <label class="form-field">
              Property ID
              <input type="text" name="property_id" placeholder="PROP-001" required />
            </label>
            <label class="form-field">
              Start Date
              <input type="date" name="start_date" required />
            </label>
            <label class="form-field">
              End Date
              <input type="date" name="end_date" required />
            </label>
            <label class="form-field">
              Rent Amount
              <input type="number" name="rent_amount" data-type="number" step="0.01" placeholder="1500.00" required />
            </label>
            <label class="form-field">
              Deposit
              <input type="number" name="deposit" data-type="number" step="0.01" placeholder="1500.00" required />
            </label>
          </div>
          <button class="primary" type="submit">Create Lease</button>
          <div class="result"></div>
        </form>

        <div class="feature-actions">
          <button class="secondary view-all" data-endpoint="/api/leases" data-table="leases-table" data-columns='[{"key":"id","label":"ID"},{"key":"tenant_id","label":"Tenant"},{"key":"property_id","label":"Property"},{"key":"start_date","label":"Start Date"},{"key":"end_date","label":"End Date"},{"key":"rent_amount","label":"Rent"},{"key":"deposit","label":"Deposit"},{"key":"status","label":"Status"},{"key":"created_at","label":"Created"}]'>View All</button>
          <button class="secondary export-csv" data-endpoint="/api/export/leases/csv">Export CSV</button>
        </div>
        <div id="leases-table" class="data-table"></div>
      </main>
    </div>
    <script src="feature-pages.js"></script>
  </body>
</html>
