<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INDEX - Maintenance Routing</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Spectral:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo">
          <svg class="logo-mark" viewBox="0 0 220 120" aria-hidden="true">
            <defs>
              <linearGradient id="leafGradient" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stop-color="#9fd4c7" />
                <stop offset="100%" stop-color="#4fc1c7" />
              </linearGradient>
              <linearGradient id="petalGradient" x1="0" x2="1" y1="1" y2="0">
                <stop offset="0%" stop-color="#67c6d3" />
                <stop offset="100%" stop-color="#3ba9c7" />
              </linearGradient>
            </defs>
            <rect x="104" y="10" width="10" height="70" rx="4" fill="#0f1c22" />
            <path
              d="M108 38c-12 4-22 14-24 26 10-2 20-10 24-21"
              fill="none"
              stroke="url(#leafGradient)"
              stroke-width="3"
              stroke-linecap="round"
            />
            <path
              d="M110 46c12 6 22 16 24 28-10-2-20-10-24-21"
              fill="none"
              stroke="url(#leafGradient)"
              stroke-width="3"
              stroke-linecap="round"
            />
            <ellipse cx="110" cy="8" rx="10" ry="7" fill="url(#leafGradient)" />
            <ellipse cx="88" cy="18" rx="12" ry="8" fill="url(#leafGradient)" />
            <ellipse cx="132" cy="18" rx="12" ry="8" fill="url(#leafGradient)" />
            <ellipse cx="84" cy="34" rx="10" ry="7" fill="url(#leafGradient)" />
            <ellipse cx="136" cy="34" rx="10" ry="7" fill="url(#leafGradient)" />
            <path
              d="M110 84c-6 10-3 20 0 26 3-6 8-14 7-23"
              fill="url(#petalGradient)"
            />
          </svg>
          <div class="logo-text">
            <span class="logo-name">INDEX</span>
            <span class="logo-sub">Property Management</span>
          </div>
        </div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="properties.html">Properties</a>
          <a href="tenant-screening.html">Screening</a>
          <a href="accounting.html">Accounting</a>
          <a href="lease-renewal.html">Renewals</a>
          <a href="communication.html">Comms</a>
          <a class="nav-cta" href="index.html#cta">Get a demo</a>
        </nav>
      </header>

      <main class="feature-page">
        <a class="back-link" href="index.html">Back to overview</a>
        <section class="feature-hero">
          <p class="eyebrow">Smart maintenance routing</p>
          <h1>Auto-assign vendors and schedules in seconds.</h1>
          <p class="lead">
            Submit a request to route the issue to the right vendor and schedule
            a response window.
          </p>
        </section>

        <form class="feature-form" data-endpoint="/api/maintenance-request" data-view-endpoint="/api/maintenance-requests" data-export-endpoint="/api/export/maintenance-requests/csv">
          <div class="form-grid">
            <label class="form-field">
              Property ID
              <input type="text" name="property_id" placeholder="BLDG-204" required />
            </label>
            <label class="form-field">
              Priority
              <select name="priority" required>
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </label>
            <label class="form-field" style="grid-column: 1 / -1;">
              Issue description
              <textarea name="issue" rows="3" placeholder="Leaking kitchen sink" required></textarea>
            </label>
          </div>
          <button class="primary" type="submit">Route request</button>
          <pre class="result"></pre>
          <button id="view-all">View All Requests</button>
          <button id="download-csv">Download CSV</button>
          <div id="table-container" style="display:none; margin-top:20px;"></div>
        </form>
      </main>
    </div>
    <script src="feature-pages.js"></script>
  </body>
</html>
