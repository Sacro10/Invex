<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - INDEX Property Management</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { 
      margin: 0; 
      padding: 2rem 0 0 0; 
      background: linear-gradient(135deg, var(--sandy, #f8f5f0) 0%, #e8e2d8 100%); 
      min-height: 100vh; 
    }
    .auth-container { 
      max-width: 450px; 
      margin: 8rem auto 2rem; 
      background: rgba(255, 255, 255, 0.95); 
      border-radius: 16px; 
      box-shadow: 0 8px 32px rgba(15, 28, 34, 0.1), 0 2px 8px rgba(15, 28, 34, 0.08); 
      padding: 3rem; 
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; background: var(--sandy, #f8f5f0); border-radius: 8px; padding: 0.25rem; }
    .auth-tabs button { 
      flex: 1; 
      padding: 0.75rem; 
      font-family: inherit; 
      font-size: 1.1rem; 
      font-weight: 500;
      border: none; 
      background: transparent; 
      color: var(--ink, #0f1c22); 
      border-radius: 6px; 
      cursor: pointer; 
      transition: all 0.3s ease;
    }
    .auth-tabs button.active { 
      background: var(--mint, #9fd4c7); 
      color: var(--ink, #0f1c22); 
      box-shadow: 0 2px 8px rgba(159, 212, 199, 0.3);
    }
    .auth-form { display: flex; flex-direction: column; gap: 1.25rem; }
    .auth-form input { 
      padding: 0.875rem; 
      border-radius: 8px; 
      border: 2px solid #e1e1e1; 
      font-size: 1rem; 
      transition: border-color 0.3s ease;
      background: #fafafa;
    }
    .auth-form input:focus { 
      outline: none; 
      border-color: var(--mint, #9fd4c7); 
      box-shadow: 0 0 0 3px rgba(159, 212, 199, 0.1);
      background: #fff;
    }
    .auth-form button { 
      background: linear-gradient(135deg, var(--mint, #9fd4c7) 0%, #7bb8a8 100%); 
      color: var(--ink, #0f1c22); 
      border: none; 
      border-radius: 8px; 
      padding: 0.875rem; 
      font-size: 1.1rem; 
      font-weight: 600;
      cursor: pointer; 
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(159, 212, 199, 0.3);
    }
    .auth-form button:hover { 
      transform: translateY(-1px); 
      box-shadow: 0 4px 12px rgba(159, 212, 199, 0.4);
    }
    .auth-form button:active { transform: translateY(0); }
    .auth-form button:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
    .auth-error { 
      color: #A3D9CC; 
      margin-top: 0.5rem; 
      font-size: 0.9rem;
      background: rgba(163, 217, 204, 0.1);
      padding: 0.5rem;
      border-radius: 4px;
      border-left: 3px solid #A3D9CC;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo" style="text-decoration:none">
      <svg class="logo-mark" viewBox="0 0 220 120" aria-hidden="true">
        <defs>
          <linearGradient id="leafGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#9fd4c7" />
            <stop offset="100%" stop-color="#4fc1c7" />
          </linearGradient>
          <linearGradient id="petalGradient" x1="0" x2="1" y1="1" y2="0">
            <stop offset="0%" stop-color="#67c6d3" />
            <stop offset="100%" stop-color="#3ba9c7" />
          </linearGradient>
        </defs>
        <rect x="104" y="10" width="10" height="70" rx="4" fill="#0f1c22" />
        <path
          d="M108 38c-12 4-22 14-24 26 10-2 20-10 24-21"
          fill="none"
          stroke="url(#leafGradient)"
          stroke-width="3"
          stroke-linecap="round"
        />
        <path
          d="M110 46c12 6 22 16 24 28-10-2-20-10-24-21"
          fill="none"
          stroke="url(#leafGradient)"
          stroke-width="3"
          stroke-linecap="round"
        />
        <ellipse cx="110" cy="8" rx="10" ry="7" fill="url(#leafGradient)" />
        <ellipse cx="88" cy="18" rx="12" ry="8" fill="url(#leafGradient)" />
        <ellipse cx="132" cy="18" rx="12" ry="8" fill="url(#leafGradient)" />
        <ellipse cx="84" cy="34" rx="10" ry="7" fill="url(#leafGradient)" />
        <ellipse cx="136" cy="34" rx="10" ry="7" fill="url(#leafGradient)" />
        <path
          d="M110 84c-6 10-3 20 0 26 3-6 8-14 7-23"
          fill="url(#petalGradient)"
        />
      </svg>
      <div class="logo-text">
        <span class="logo-name">INDEX</span>
        <span class="logo-sub">Property Management</span>
      </div>
    </a>
  </header>
  <main>
    <div class="auth-container">
      <div class="auth-tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="registerTab">Sign Up</button>
      </div>
      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email" required autocomplete="username">
        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
        <button type="submit">Login</button>
        <div class="auth-error" id="loginError"></div>
      </form>
      <form id="registerForm" class="auth-form" style="display:none">
        <input type="text" id="registerOrg" placeholder="Organization Name" required>
        <input type="email" id="registerEmail" placeholder="Email" required autocomplete="username">
        <input type="password" id="registerPassword" placeholder="Password" required autocomplete="new-password">
        <button type="submit">Sign Up</button>
        <div class="auth-error" id="registerError"></div>
      </form>
    </div>
  </main>
  <script>
    const API_BASE = window.API_BASE || "";
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    loginTab.onclick = () => { loginTab.classList.add('active'); registerTab.classList.remove('active'); loginForm.style.display = ''; registerForm.style.display = 'none'; };
    registerTab.onclick = () => { registerTab.classList.add('active'); loginTab.classList.remove('active'); registerForm.style.display = ''; loginForm.style.display = 'none'; };
    loginForm.onsubmit = async e => {
      e.preventDefault();
      document.getElementById('loginError').textContent = '';
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');
        localStorage.setItem('access_token', data.access_token);
        window.location.href = 'index.html';
      } catch (err) {
        document.getElementById('loginError').textContent = err.message;
      }
    };
    registerForm.onsubmit = async e => {
      e.preventDefault();
      document.getElementById('registerError').textContent = '';
      const organization_name = document.getElementById('registerOrg').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      try {
        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ organization_name, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');
        localStorage.setItem('access_token', data.access_token);
        window.location.href = 'index.html';
      } catch (err) {
        document.getElementById('registerError').textContent = err.message;
      }
    };
  </script>
</body>
</html>
